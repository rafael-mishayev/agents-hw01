<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="780" viewBox="0 0 680 520" role="img">
<title>Actor-Critic architecture</title>
<desc>Background sources and the chat history feed the Actor. The Critic evaluates each draft and returns an Evaluation. A rejection sends feedback back to the Actor, up to 3 attempts. Three exits: approved, attempts exhausted, technical error. Every question is written to a JSON log.</desc>
<style>
text { font-family: "Segoe UI", Arial, sans-serif; fill: #3d3d3a; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; }
.arr { fill: none; stroke: #73726c; stroke-width: 1.5; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
.gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; }
.purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
.teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
.coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.8; }
.coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="520" fill="#ffffff"/>

<g class="gray"><rect x="30" y="30" width="170" height="56" rx="8"/><text class="th" x="115" y="50" text-anchor="middle" dominant-baseline="central">Background sources</text><text class="ts" x="115" y="68" text-anchor="middle" dominant-baseline="central">linkedin + summary</text></g>
<g class="gray"><rect x="30" y="110" width="170" height="56" rx="8"/><text class="th" x="115" y="130" text-anchor="middle" dominant-baseline="central">Gradio chat</text><text class="ts" x="115" y="148" text-anchor="middle" dominant-baseline="central">question + history</text></g>
<g class="purple"><rect x="250" y="70" width="180" height="56" rx="8"/><text class="th" x="340" y="90" text-anchor="middle" dominant-baseline="central">Actor</text><text class="ts" x="340" y="108" text-anchor="middle" dominant-baseline="central">generate or rerun</text></g>
<g class="purple"><rect x="480" y="70" width="170" height="56" rx="8"/><text class="th" x="565" y="90" text-anchor="middle" dominant-baseline="central">Critic</text><text class="ts" x="565" y="108" text-anchor="middle" dominant-baseline="central">checks vs sources</text></g>
<g class="purple"><rect x="480" y="170" width="170" height="56" rx="8"/><text class="th" x="565" y="190" text-anchor="middle" dominant-baseline="central">Evaluation</text><text class="ts" x="565" y="208" text-anchor="middle" dominant-baseline="central">bool + feedback</text></g>

<line x1="200" y1="58" x2="248" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="200" y1="138" x2="248" y2="108" class="arr" marker-end="url(#arrow)"/>
<line x1="430" y1="98" x2="478" y2="98" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="454" y="86" text-anchor="middle">draft</text>
<line x1="565" y1="126" x2="565" y2="168" class="arr" marker-end="url(#arrow)"/>

<path d="M480 198 L340 198 L340 130" class="arr" style="stroke:#D85A30" marker-end="url(#arrow-coral)"/>
<text class="ts" x="412" y="186" text-anchor="middle">feedback to Actor</text>
<text class="ts" x="412" y="216" text-anchor="middle">max 3 attempts</text>

<path d="M565 226 L565 262 L125 262" class="arr"/>
<line x1="125" y1="262" x2="125" y2="316" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="262" x2="340" y2="316" class="arr" marker-end="url(#arrow)"/>
<line x1="555" y1="262" x2="555" y2="316" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="133" y="292">true</text>
<text class="ts" x="348" y="292">3 rejections</text>
<text class="ts" x="563" y="292">failure</text>

<g class="teal"><rect x="30" y="318" width="190" height="56" rx="8"/><text class="th" x="125" y="338" text-anchor="middle" dominant-baseline="central">Approved</text><text class="ts" x="125" y="356" text-anchor="middle" dominant-baseline="central">shown in chat</text></g>
<g class="coral"><rect x="245" y="318" width="190" height="56" rx="8"/><text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central">Attempts exhausted</text><text class="ts" x="340" y="356" text-anchor="middle" dominant-baseline="central">status message shown</text></g>
<g class="coral"><rect x="460" y="318" width="190" height="56" rx="8"/><text class="th" x="555" y="338" text-anchor="middle" dominant-baseline="central">Technical error</text><text class="ts" x="555" y="356" text-anchor="middle" dominant-baseline="central">error message shown</text></g>

<path d="M30 346 L12 346 L12 138 L28 138" class="arr" style="stroke:#1D9E75;stroke-dasharray:4 3" marker-end="url(#arrow-teal)"/>
<line x1="125" y1="374" x2="125" y2="418" class="arr" style="stroke-dasharray:4 3" marker-end="url(#arrow)"/>
<line x1="340" y1="374" x2="340" y2="418" class="arr" style="stroke-dasharray:4 3" marker-end="url(#arrow)"/>
<line x1="555" y1="374" x2="555" y2="418" class="arr" style="stroke-dasharray:4 3" marker-end="url(#arrow)"/>

<g class="gray"><rect x="30" y="420" width="620" height="52" rx="8"/><text class="th" x="340" y="440" text-anchor="middle" dominant-baseline="central">Execution log (JSON)</text><text class="ts" x="340" y="458" text-anchor="middle" dominant-baseline="central">per question: attempts and status</text></g>

<g class="purple"><rect x="30" y="494" width="12" height="12" rx="2"/></g><text class="ts" x="48" y="500" dominant-baseline="central">LLM call</text>
<g class="teal"><rect x="150" y="494" width="12" height="12" rx="2"/></g><text class="ts" x="168" y="500" dominant-baseline="central">success path</text>
<g class="coral"><rect x="290" y="494" width="12" height="12" rx="2"/></g><text class="ts" x="308" y="500" dominant-baseline="central">feedback and stop paths</text>
<g class="gray"><rect x="480" y="494" width="12" height="12" rx="2"/></g><text class="ts" x="498" y="500" dominant-baseline="central">data, UI, log</text>
</svg>
